<div class="container mx-auto px-4 py-8">
  <div class="max-w-3xl mx-auto">
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <h2 class="card-title justify-center text-3xl mb-6">Личный кабинет</h2>

        @if (user()) {
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-base-200 rounded-lg p-4">
              <div class="text-sm text-base-content/60 mb-1">ID</div>
              <div class="text-lg font-semibold break-all">{{ uid() }}</div>
            </div>
            <div class="bg-base-200 rounded-lg p-4">
              <div class="text-sm text-base-content/60 mb-1">E-mail</div>
              <div class="text-lg font-semibold break-all">{{ email() }}</div>
            </div>
            <div class="bg-base-200 rounded-lg p-4">
              <div class="text-sm text-base-content/60 mb-1">Имя</div>
              <div class="text-lg font-semibold break-all">{{ name() }}</div>
            </div>
            <div class="bg-base-200 rounded-lg p-4">
              <div class="text-sm text-base-content/60 mb-1">Телефон</div>
              <div class="text-lg font-semibold break-all">{{ phone() }}</div>
            </div>
            <div class="bg-base-200 rounded-lg p-4">
              <div class="text-sm text-base-content/60 mb-1">Дата регистрации</div>
              <div class="text-base font-medium">{{ creation() }}</div>
            </div>
            <div class="bg-base-200 rounded-lg p-4">
              <div class="text-sm text-base-content/60 mb-1">Последний вход</div>
              <div class="text-base font-medium">{{ lastLogin() }}</div>
            </div>
          </div>

          <div class="card-actions justify-center">
            <button
              (click)="logout()"
              class="btn btn-ghost border-2 border-base-content/20 btn-wide"
            >
              Выйти
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</div>
