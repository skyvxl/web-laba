<h1 class="text-2xl md:text-3xl font-bold text-center mb-6">КАТАЛОГ ТОВАРОВ</h1>

<p class="mb-6 text-gray-800 text-center">
  В нашем каталоге представлен широкий ассортимент цифровой и бытовой техники. Выберите интересующий
  вас товар для просмотра подробной информации.
</p>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
  @if (products$ | async; as products) {
    @for (product of products; track product.id) {
      <app-product-card [product]="product" />
    }
  } @else {
    <div class="flex justify-center items-center w-full col-span-full">
      <div
        class="loader w-[50px] aspect-square rounded-full border-8 border-transparent border-r-orange-400"
      ></div>
    </div>
  }
</div>
