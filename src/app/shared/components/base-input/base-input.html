@if (title()) {
  <div class="mb-3">
    <label for="{{ title() }}" class="font-medium">{{ title() }}</label>
    <input
      [formControl]="control"
      id="{{ title() }}"
      name="{{ title() }}"
      type="{{ type() }}"
      [placeholder]="placeholder() || ''"
      [required]="required()"
      class="w-full border border-gray-400 px-2 py-1 mt-1"
    />
  </div>
} @else {
  <input
    [formControl]="control"
    type="{{ type() }}"
    [placeholder]="placeholder()"
    [required]="required()"
    class="w-full p-1 text-black bg-white"
  />
}
