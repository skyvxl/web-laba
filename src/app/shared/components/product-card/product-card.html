<div class="card bg-base-100 shadow-xl hover:shadow-2xl transition-shadow h-full flex flex-col">
  <figure class="px-4 pt-4">
    <img
      [alt]="product().name"
      [src]="product().image"
      class="rounded-xl h-48 w-full object-contain"
      height="192"
      width="192"
    />
  </figure>
  <div class="card-body flex-1 flex flex-col">
    <h2 class="card-title text-lg line-clamp-2">{{ product().name }}</h2>
    <p class="text-sm text-base-content/70 line-clamp-3 flex-1">{{ product().shortDescription }}</p>
    <div class="card-actions justify-between items-center mt-4">
      <div class="flex flex-col">
        @if (product().oldPrice) {
          <span class="text-sm text-base-content/50 line-through">{{ product().oldPrice }} ₽</span>
        }
        <span class="text-xl font-bold text-primary">{{ product().price }} ₽</span>
      </div>
      <button
        class="btn btn-ghost border-2 border-base-content/20 btn-sm"
        [routerLink]="['/product', product().id]"
      >
        Подробнее
      </button>
    </div>
  </div>
</div>
