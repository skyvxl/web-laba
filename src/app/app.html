<div class="container mx-auto max-w-4xl bg-white overflow-hidden text-sm">
  <header>
    <div class="bg-[#ff8000] p-4 text-white">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-xl font-bold w-full md:w-1/5 flex justify-center md:justify-start">
          <img
            src="image.png"
            class="h-16 w-16 md:h-24 md:w-24"
            width="96"
            height="96"
            alt="DNS логотип, 96x96px"
            title="DNS логотип, 96x96px"
          />
        </div>

        <div class="text-center md:text-left w-full md:w-3/5">
          <h1 class="text-xl md:text-3xl font-bold uppercase">DNS - Магазин Электроники</h1>
        </div>

        <div class="w-full md:w-1/5">
          <form class="flex flex-col gap-2">
            <div>
              <app-base-input [type]="'text'" [placeholder]="'логин'" />
            </div>
            <div>
              <app-base-input [type]="'password'" [placeholder]="'пароль'" />
            </div>
            <div class="flex gap-2 items-center justify-between">
              <button
                type="submit"
                class="bg-gray-700 text-white px-5 py-1 hover:bg-gray-600 transition-colors text-sm cursor-pointer"
              >
                войти
              </button>
              <a routerLink="/register" class="text-white hover:underline text-sm">регистрация</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <nav class="bg-orange-300 p-2">
      <div class="flex justify-evenly items-center text-xs md:text-sm">
        <a routerLink="/" class="font-semibold text-white hover:underline hover:cursor-pointer"
          >Главная</a
        >
        <a routerLink="/about" class="font-semibold text-white hover:underline hover:cursor-pointer"
          >О нас</a
        >
        <a
          routerLink="/catalog"
          class="font-semibold text-white hover:underline hover:cursor-pointer"
          >Каталог</a
        >
        <a
          routerLink="/contacts"
          class="font-semibold text-white hover:underline hover:cursor-pointer"
          >Контакты</a
        >
      </div>
    </nav>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-6 gap-4 py-4">
    <!-- left aside -->
    <aside class="hidden lg:block lg:col-span-1 bg-[#ff8000] text-white p-4 text-center">
      <nav class="flex flex-col gap-2">
        <a href="#" class="block p-1 hover:underline">Смартфоны</a>
        <a href="#" class="block p-1 hover:underline">Ноутбуки</a>
        <a href="#" class="block p-1 hover:underline">Бытовая техника</a>
        <a href="#" class="block p-1 hover:underline">Аксессуары</a>
      </nav>
    </aside>

    <main class="col-span-1 lg:col-span-4 px-4 lg:px-0">
      <router-outlet></router-outlet>
    </main>

    <!-- right aside -->
    <aside class="hidden lg:block lg:col-span-1 bg-[#ff8000] text-white p-1.5 text-center">
      <div class="flex flex-col gap-4">
        <div>
          <app-base-input [type]="'text'" [placeholder]="'поиск'" />
          <button
            class="bg-gray-700 text-white px-3 py-1 mt-1 hover:bg-gray-600 transition-colors text-sm cursor-pointer"
          >
            Найти
          </button>
        </div>
        <a href="#">
          <img
            src="https://brandwiki.ru/up/brands/product/210720_554.webp"
            alt="Ситилинк"
            class="w-full hover:opacity-80 transition-opacity h-20 object-cover"
            title="Ситилинк"
            width="124"
            height="80"
          />
        </a>
        <a href="#">
          <img
            src="https://assets.turbologo.ru/blog/ru/2020/02/18162818/logo-mts-ks.png"
            alt="МТС"
            class="w-full hover:opacity-80 transition-opacity h-20 object-cover"
            title="МТС"
            width="124"
            height="80"
          />
        </a>
        <a href="#">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQxcbHHqNVRXBkbzOlKy8svirKu53s24kZvg&s"
            alt="iPhone 17 Pro Max"
            class="w-full hover:opacity-80 transition-opacity h-20"
            title="iPhone 17 Pro Max"
            width="124"
            height="80"
          />
        </a>
      </div>
    </aside>
  </div>

  <footer class="text-white">
    <div class="flex w-full bg-[#ff8000] p-4">
      <p class="text-sm text-center w-full">&copy; 2025 DNS. Все права защищены</p>
    </div>
  </footer>
</div>
