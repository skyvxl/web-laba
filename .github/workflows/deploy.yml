name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: All things angular + deploy
        # use a released tag (replace with latest if newer than v1.4.0)
        uses: AhsanAyaz/angular-deploy-gh-pages-actions@v1.4.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          build_configuration: production # must match angular.json
          base_href: /web-laba/
          deploy_branch: gh-pages
          angular_dist_build_folder: dist/laba # или dist, в зависимости от вашей сборки
